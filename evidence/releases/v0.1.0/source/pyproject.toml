[project]
name = "rage-jepa"
version = "0.1.0"
description = "A small state-vector JEPA and an auditable ten-pole hybrid controller"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marc / Rage Industries" }]
dependencies = ["numpy>=1.26", "torch>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]
simulation = ["mujoco==3.12.0", "casadi==3.8.1"]

[project.scripts]
rage-jepa = "rage_mill.jepa_train:main"

[project.urls]
Repository = "https://github.com/marctheshark3/rage-jepa"
Article = "https://neuralyogi.com/essays/a-small-model-and-ten-pendulums/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rage_mill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
